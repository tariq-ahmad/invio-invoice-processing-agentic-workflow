[project]
name = "invio-invoice-processing-agent"
version = "0.1.0"
description = "ADK 2.0 agentic workflow for Accounts Payable invoice automation."



dependencies = [
    "google-adk[gcp,a2a]>=2.0.0,<3.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-secret-manager>=2.20.0,<3.0.0",
    "google-cloud-storage>=2.18.0",
    "mcp>=1.0.0,<2.0.0",
    "pypdf>=6.13.2",
    "agentmail>=2.0.12,<3.0.0",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "google-cloud-modelarmor>=0.2.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    # A2UI surfaces are built deterministically in app/a2ui_views.py using only
    # google-genai types, so a2ui-agent-sdk is NOT a runtime dependency. It is a
    # test-only dependency: tests validate the generated surfaces against the
    # bundled "basic" catalog JSON Schema. (Runtime emission is gated by the
    # ENABLE_A2UI env var, default "true".)
    "a2ui-agent-sdk>=0.2.4,<1.0.0",
    # Used by tests/fixtures/generate_invoices.py to (re)generate the sample
    # invoice PDFs and the blurry-scan image fixtures. Generation is a one-time
    # authoring step; the committed fixtures don't need these at runtime.
    "reportlab>=4.0.0,<5.0.0",
    "pillow>=10.0.0,<12.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "uv.lock,.venv,./frontend,**/package-lock.json"




[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]


